<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FixLoop — replay d'une réparation</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="replay">
<main id="app">

<p id="honesty" role="note"></p>

<p><label for="session-select">Session</label>
<select id="session-select"></select></p>

<div class="stage">
<video id="replay-video" playsinline muted preload="auto" controlslist="nodownload"></video>
<svg id="replay-overlay" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
</div>

<p id="step-banner" role="status"></p>
<p id="subtitle"></p>
<p id="measure-line"></p>

<div class="buttons">
<button id="btn-play" type="button">Lecture</button>
<button id="btn-speed" type="button">×1</button>
<button id="btn-sound" type="button">Son : non</button>
</div>

<svg id="curve" aria-label="Courbe du contact"></svg>
<div id="timeline" role="list"></div>
<section id="event-detail" aria-live="polite"></section>

<div id="thresholds">
<label for="thr-on">Seuil « en place » <input id="thr-on" type="range" min="0" max="0.5" step="0.01" value="0.18"></label>
<label for="thr-off">Seuil « tombée » <input id="thr-off" type="range" min="0" max="0.5" step="0.01" value="0.26"></label>
<p id="sim-note" hidden>Simulation : la frise des événements réels ne change pas.</p>
</div>

<p id="links"></p>

</main>
<script type="module">
import { wire, loadIndex, selectSession, onPlayPressed, onSpeedPressed, onSoundPressed, onThresholdInput } from "./replay.js";

const video = document.getElementById("replay-video");
const svg = document.getElementById("replay-overlay");
wire(video, svg);
const select = document.getElementById("session-select");
const index = await loadIndex();
for (const s of index) {
  const opt = document.createElement("option");
  opt.value = s.name;
  opt.textContent = s.title || s.name;
  select.appendChild(opt);
}
const wanted = new URLSearchParams(location.search).get("session");
await selectSession(select.value = (index.some((s) => s.name === wanted) && wanted) || (index[0] && index[0].name) || "");
select.addEventListener("change", () => selectSession(select.value));
document.getElementById("btn-play").addEventListener("click", onPlayPressed);
document.getElementById("btn-speed").addEventListener("click", onSpeedPressed);
document.getElementById("btn-sound").addEventListener("click", onSoundPressed);
document.getElementById("thr-on").addEventListener("input", onThresholdInput);
document.getElementById("thr-off").addEventListener("input", onThresholdInput);
</script>
</body>
</html>
